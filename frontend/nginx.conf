server {
    listen 80;

    # SPA: ทุก path ที่ไม่ใช่ไฟล์จริงต้องตกมาที่ index.html ไม่งั้นรีเฟรชหน้าแล้ว 404
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ยิงต่อให้ backend ในเน็ตเวิร์ก compose เบราว์เซอร์จึงเห็นเป็น origin เดียว ไม่ต้องตั้ง CORS
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # แชทรอโมเดลตอบได้นานกว่าค่า default 60 วิ
        proxy_read_timeout 180s;
    }
}
